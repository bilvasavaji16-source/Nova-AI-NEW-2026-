
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Nevuxa AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 350px;
            background: #151515;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #333;
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        p {
            text-align: center;
            color: #aaa;
        }

        label {
            display: block;
            margin-top: 14px;
            margin-bottom: 7px;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 13px;
            background: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #888;
        }

        .password-container {
            display: flex;
            gap: 8px;
        }

        .password-container input {
            flex: 1;
            min-width: 0;
        }

        .eye-button {
            width: 46px;
            flex-shrink: 0;
            padding: 8px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 8px;
            cursor: pointer;
        }

        .terms-checkbox {
            margin-top: 18px;
        }

        .terms-checkbox label {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            line-height: 1.5;
        }

        .terms-checkbox input {
            width: auto;
            flex-shrink: 0;
            margin-top: 4px;
        }

        .create-button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: white;
            color: black;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .create-button:hover {
            background: #ddd;
        }

        .error {
            color: #ff9999;
            background: #351111;
            border: 1px solid #772222;
            border-radius: 8px;
            padding: 10px;
            margin-top: 15px;
            text-align: center;
        }

        .link {
            margin-top: 20px;
            text-align: center;
            color: #aaa;
        }

        a {
            color: white;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="box">

        <h1>Create Nevuxa Account</h1>
        <p>Make your Nevuxa AI account.</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" id="signupForm">

            <label for="email">Email address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>
            <div class="password-container">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required
                >
                <button
                    type="button"
                    class="eye-button"
                    onclick="togglePassword('password', this)"
                    aria-label="Show or hide password"
                    title="Show or hide password"
                >👁</button>
            </div>

            <label for="confirm_password">Confirm password</label>
            <div class="password-container">
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Enter password again"
                    autocomplete="new-password"
                    required
                >
                <button
                    type="button"
                    class="eye-button"
                    onclick="togglePassword('confirm_password', this)"
                    aria-label="Show or hide password confirmation"
                    title="Show or hide password confirmation"
                >👁</button>
            </div>

            <div class="terms-checkbox">
                <label>
                    <input type="checkbox" name="terms" required>
                    <span>
                        I agree to the
                        <a href="{{ url_for('terms') }}" target="_blank">
                            Terms &amp; Conditions
                        </a>
                        and
                        <a href="{{ url_for('privacy') }}" target="_blank">
                            Privacy Policy
                        </a>.
                    </span>
                </label>
            </div>

            <div
                id="passwordError"
                class="error"
                style="display: none;"
                role="alert"
            >
                Passwords do not match.
            </div>

            <button type="submit" class="create-button">
                Create Account
            </button>

        </form>

        <div class="link">
            Already have an account?
            <a href="/login">Sign in</a>
        </div>

    </div>

    <script>
        function togglePassword(fieldId, button) {
            const field = document.getElementById(fieldId);

            if (field.type === "password") {
                field.type = "text";
                button.textContent = "🙈";
            } else {
                field.type = "password";
                button.textContent = "👁";
            }
        }

        document.getElementById("signupForm").addEventListener(
            "submit",
            function (event) {
                const password =
                    document.getElementById("password").value;

                const confirmation =
                    document.getElementById("confirm_password").value;

                const error =
                    document.getElementById("passwordError");

                if (password !== confirmation) {
                    event.preventDefault();
                    error.style.display = "block";
                } else {
                    error.style.display = "none";
                }
            }
        );
    </script>
</body>

</html>
