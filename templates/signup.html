<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Nevuxa AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .signup-box {
            width: 360px;
            padding: 35px;

            background: #111;
            border: 1px solid #333;
            border-radius: 18px;

            box-shadow:
                0 0 30px rgba(255, 255, 255, 0.05);
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;

            border-radius: 10px;
            border: 1px solid #444;

            background: #050505;
            color: white;

            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #777;
        }

        .signup-button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 10px;

            background: white;
            color: black;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .signup-button:hover {
            background: #ddd;
        }

        .login-text {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
        }

        .login-text a {
            color: white;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        .error {
            background: #351111;
            border: 1px solid #772222;

            color: #ffaaaa;

            padding: 10px;
            border-radius: 8px;

            margin-bottom: 18px;

            text-align: center;
        }
    </style>
</head>

<body>

<div class="signup-box">

    <h1>Nevuxa AI</h1>

    <div class="subtitle">
        Create your account
    </div>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            required
        >

        <button
            type="submit"
            class="signup-button"
        >
            Sign Up
        </button>

    </form>

    <div class="login-text">

        Already have an account?

        <a href="/login">
            Log in
        </a>

    </div>

</div>

</body>
</html>
