<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Nevuxa AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 360px;
            padding: 35px;

            background: #111;
            border: 1px solid #333;
            border-radius: 18px;

            box-shadow:
                0 0 30px rgba(255, 255, 255, 0.05);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;

            border-radius: 10px;
            border: 1px solid #444;

            background: #050505;
            color: white;

            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #777;
        }

        .password-container {
            position: relative;
        }

        .password-container input {
            padding-right: 48px;
        }

        .eye-button {
            position: absolute;

            right: 8px;
            top: 0;

            height: 44px;
            width: 40px;

            border: none;
            background: transparent;

            color: #aaa;

            cursor: pointer;
            font-size: 20px;
        }

        .eye-button:hover {
            color: white;
        }

        .login-button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 10px;

            background: white;
            color: black;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .login-button:hover {
            background: #ddd;
        }

        .signup-text {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
        }

        .signup-text a {
            color: white;
            text-decoration: none;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        .error {
            background: #351111;
            border: 1px solid #772222;

            color: #ffaaaa;

            padding: 10px;
            border-radius: 8px;

            margin-bottom: 18px;

            text-align: center;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>Nevuxa AI</h1>

    <div class="subtitle">
        Sign in to continue
    </div>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">
            Password
        </label>

        <div class="password-container">

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button
                type="button"
                class="eye-button"
                id="eyeButton"
                onclick="togglePassword()"
                title="Show password"
            >
                👁
            </button>

        </div>

        <button
            type="submit"
            class="login-button"
        >
            Log In
        </button>

    </form>

    <div class="signup-text">

        Don't have an account?

        <a href="/signup">
            Sign up
        </a>

    </div>

</div>

<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    const eyeButton =
        document.getElementById("eyeButton");

    if (password.type === "password") {

        password.type = "text";

        eyeButton.textContent = "🙈";

        eyeButton.title = "Hide password";

    } else {

        password.type = "password";

        eyeButton.textContent = "👁";

        eyeButton.title = "Show password";
    }
}

</script>

</body>
</html>
