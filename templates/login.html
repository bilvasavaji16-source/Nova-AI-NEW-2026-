```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Nevuxa</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0b12;
            color: #f5f5ff;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 100%;
            max-width: 390px;
            padding: 34px;
            background: #171722;
            border: 1px solid #303044;
            border-radius: 20px;
            box-shadow: 0 15px 50px #00000055;
        }

        .brand {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .brand span {
            color: #9b8cff;
        }

        .subtitle {
            text-align: center;
            color: #aaaabd;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            display: block;
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            background: #0d0d15;
            color: white;
            border: 1px solid #3a3a50;
            border-radius: 10px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #8270ff;
            border-color: transparent;
        }

        .password-container {
            position: relative;
        }

        .password-container input {
            padding-right: 48px;
        }

        .eye-button {
            position: absolute;
            right: 5px;
            top: 2px;
            width: 40px;
            height: 42px;
            border: 0;
            background: transparent;
            color: #c5c5d8;
            cursor: pointer;
            font-size: 19px;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            margin-top: 4px;
            background: #8270ff;
            color: white;
            border: 0;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #6e5be8;
        }

        .signup-text {
            margin-top: 23px;
            text-align: center;
            color: #aaaabd;
            font-size: 14px;
        }

        a {
            color: #b3a8ff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .error {
            padding: 11px;
            margin-bottom: 18px;
            border-radius: 9px;
            background: #391b26;
            border: 1px solid #713448;
            color: #ffb9c8;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <main class="login-box">
        <div class="brand">Nevuxa<span>.</span></div>
        <div class="subtitle">Sign in to continue</div>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>

            <div class="password-container">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="eye-button"
                    id="eyeButton"
                    onclick="togglePassword()"
                    aria-label="Show password"
                >👁</button>
            </div>

            <button type="submit" class="login-button">
                Log In
            </button>
        </form>

        <div class="signup-text">
            Don't have an account?
            <a href="{{ url_for('signup') }}">Sign up</a>
        </div>
    </main>

    <script>
        function togglePassword() {
            const password = document.getElementById("password");
            const eyeButton = document.getElementById("eyeButton");

            if (password.type === "password") {
                password.type = "text";
                eyeButton.textContent = "🙈";
                eyeButton.setAttribute("aria-label", "Hide password");
            } else {
                password.type = "password";
                eyeButton.textContent = "👁";
                eyeButton.setAttribute("aria-label", "Show password");
            }
        }
    </script>
</body>
</html>
```
