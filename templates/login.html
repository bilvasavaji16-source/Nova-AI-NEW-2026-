<!DOCTYPE html>
<html>

<head>

    <title>Sign in - Nova AI</title>

    <style>

        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .box {
            width: 350px;
            background: #151515;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #333;
        }

        h1 {
            text-align: center;
        }

        p {
            text-align: center;
            color: #aaa;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            margin-bottom: 12px;

            background: #222;
            color: white;

            border: 1px solid #444;
            border-radius: 8px;

            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 13px;

            background: #333;
            color: white;

            border: 1px solid #555;
            border-radius: 8px;

            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .error {
            color: #ff7777;
            text-align: center;
        }

        a {
            color: #aaa;
        }

        .link {
            margin-top: 18px;
            text-align: center;
        }

        /* Password field */

        .password-container {
            position: relative;
            width: 100%;
        }

        .password-container input {
            padding-right: 50px;
        }

        .eye-button {
            position: absolute;
            right: 8px;
            top: 10px;

            width: 38px;
            height: 38px;

            padding: 0;

            background: transparent;
            border: none;

            cursor: pointer;

            font-size: 18px;
        }

        .eye-button:hover {
            background: #333;
        }

    </style>

</head>


<body>

    <div class="box">

        <h1>Nova AI</h1>

        <p>Welcome back.</p>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Email"
                required
            >


            <div class="password-container">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <button
                    type="button"
                    class="eye-button"
                    onclick="togglePassword()"
                    title="Show password"
                >
                    👁
                </button>

            </div>


            <button type="submit">
                Sign in
            </button>

        </form>


        <div class="link">

            Don't have an account?

            <a href="/signup">
                Create one
            </a>

        </div>

    </div>


    <script>

        function togglePassword() {

            const password = document.getElementById("password");
            const eye = document.querySelector(".eye-button");

            if (password.type === "password") {

                password.type = "text";
                eye.textContent = "🙈";
                eye.title = "Hide password";

            } else {

                password.type = "password";
                eye.textContent = "👁";
                eye.title = "Show password";

            }

        }

    </script>

</body>

</html>
